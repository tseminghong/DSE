<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Paper - Chinese</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .tab-button.active { background-color: #3b82f6; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tab-button:not(.active):hover { background-color: #f3f4f6; }
        tbody tr:hover { background-color: #f9fafb; }
        .download-button { color: #3b82f6; text-decoration: none; transition: all 0.2s ease-in-out; padding: 0.25rem 0.5rem; border-radius: 0.375rem; }
        .download-button:hover { text-decoration: underline; background-color: #eff6ff; }
        html { scroll-behavior: smooth; }
        .scroll-section { scroll-margin-top: 2rem; }
        .section-header { background-color: #f3f4f6; font-weight: 600; color: #374151; border-bottom: 2px solid #e5e7eb; }
    </style>
</head>
<body class="min-h-screen">
    <header class="flex items-center justify-between p-4 bg-white shadow-sm border-b border-gray-100">
        <div class="flex items-center space-x-2">
            <svg class="h-6 w-6 text-gray-600 cursor-pointer" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
            <span class="font-semibold text-lg text-gray-700">Past Paper</span>
        </div>
        <nav class="hidden md:flex items-center space-x-6">
            <a href="index.html" class="text-gray-600 hover:text-gray-900 transition-colors duration-200">Home</a>
        </nav>
    </header>

    <main class="container p-4 sm:p-6 lg:p-8">
        <h1 class="text-3xl sm:text-4xl font-bold mb-6 text-gray-900">Chinese</h1>

        <div class="flex bg-white p-1 rounded-lg shadow-sm border border-gray-200 mb-8 sticky top-4 z-10">
            <button id="tab-2012-2023" class="tab-button flex-1 py-2 px-4 text-center rounded-md transition-all duration-300 active">2012-2023</button>
        </div>

        <section class="bg-white p-6 rounded-lg shadow-md mb-8">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Year</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Paper 1</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Paper 2</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Answer</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Performance</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr id="past-papers-section" class="scroll-section">
                            <td colspan="5" class="px-4 py-3 text-lg font-semibold text-gray-800 section-header">Past Papers (2012-2023)</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const pastPapersData = [
            { year: 2012, p1: 'chin/2012/p1.pdf', p2: 'chin/2012/p2.pdf', ans: 'chin/2012/ans.pdf', per: 'chin/2012/per.pdf' },
            { year: 2013, p1: 'chin/2013/p1.pdf', p2: 'chin/2013/p2.pdf', ans: 'chin/2013/ans.pdf', per: 'chin/2013/per.pdf' },
            { year: 2014, p1: 'chin/2014/p1.pdf', p2: 'chin/2014/p2.pdf', ans: 'chin/2014/ans.pdf', per: 'chin/2014/per.pdf' },
            { year: 2015, p1: 'chin/2015/p1.pdf', p2: 'chin/2015/p2.pdf', ans: 'chin/2015/ans.pdf', per: 'chin/2015/per.pdf' },
            { year: 2016, p1: 'chin/2016/p1.pdf', p2: 'chin/2016/p2.pdf', ans: 'chin/2016/ans.pdf', per: 'chin/2016/per.pdf' },
            { year: 2017, p1: 'chin/2017/p1.pdf', p2: 'chin/2017/p2.pdf', ans: 'chin/2017/ans.pdf', per: 'chin/2017/per.pdf' },
            { year: 2018, p1: 'chin/2018/p1.pdf', p2: 'chin/2018/p2.pdf', ans: 'chin/2018/ans.pdf', per: 'chin/2018/per.pdf' },
            { year: 2019, p1: 'chin/2019/p1.pdf', p2: 'chin/2019/p2.pdf', ans: 'chin/2019/ans.pdf', per: 'chin/2019/per.pdf' },
            { year: 2020, p1: 'chin/2020/p1.pdf', p2: 'chin/2020/p2.pdf', ans: 'chin/2020/ans.pdf', per: 'chin/2020/per.pdf' },
            { year: 2021, p1: 'chin/2021/p1.pdf', p2: 'chin/2021/p2.pdf', ans: 'chin/2021/ans.pdf', per: 'chin/2021/per.pdf' },
            { year: 2022, p1: 'chin/2022/p1.pdf', p2: 'chin/2022/p2.pdf', ans: 'chin/2022/ans.pdf', per: 'chin/2022/per.pdf' },
            // 2023 has no answer and performance files
            { year: 2023, p1: 'chin/2023/p1.pdf', p2: 'chin/2023/p2.pdf', ans: null, per: null },
        ];

        const tbody = document.querySelector('tbody');
        pastPapersData.forEach(p => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="px-4 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${p.year}</td>
                <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">${p.p1 ? `<a href="${p.p1}" class="download-button">Download</a>` : '<span class="text-gray-400">Unavailable</span>'}</td>
                <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">${p.p2 ? `<a href="${p.p2}" class="download-button">Download</a>` : '<span class="text-gray-400">Unavailable</span>'}</td>
                <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">${p.ans ? `<a href="${p.ans}" class="download-button">Download</a>` : '<span class="text-gray-400">Unavailable</span>'}</td>
                <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">${p.per ? `<a href="${p.per}" class="download-button">Download</a>` : '<span class="text-gray-400">Unavailable</span>'}</td>
            `;
            tbody.appendChild(row);
        });
    </script>
</body>
</html>
